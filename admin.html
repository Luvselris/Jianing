<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard ♡ Yuè Jiāníng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: rgba(255, 255, 255, 0.96);
      --deep-pink: #fb6f92;
      --border-pink: #ffc2d1;
      --text-main: #4a3b3e;
      --text-muted: #9c8287;
      --glow-shadow: 0 10px 30px rgba(251, 111, 146, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body {
      background: radial-gradient(circle at top, #ffe5ec 0%, #fff0f3 55%, #ffe8ed 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    #loginView { min-height: 75vh; display: flex; flex-direction: column; justify-content: center; }
    .login-card {
      background: var(--card-bg);
      border-radius: 30px;
      padding: 38px 24px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-pink);
      text-align: center;
    }
    .input-field, .textarea-field {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid var(--border-pink);
      border-radius: 18px; font-size: 14px;
      background: #fff; color: var(--text-main);
      outline: none; margin-bottom: 12px;
    }
    .input-field:focus, .textarea-field:focus {
      border-color: var(--deep-pink);
    }
    .btn-pink {
      width: 100%;
      background: linear-gradient(135deg, #ffc2d1, var(--deep-pink));
      color: #fff; border: none; padding: 13px;
      border-radius: 20px; font-size: 14.5px;
      font-weight: 600; cursor: pointer;
      box-shadow: 0 6px 16px rgba(251, 111, 146, 0.35);
    }
    #dashboardView { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .panel-card {
      background: var(--card-bg);
      border-radius: 26px; padding: 22px 18px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-pink);
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 15.5px; font-weight: 700;
      color: var(--deep-pink); margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hl-admin-card {
      background: #ffffff;
      border: 1.5px solid var(--border-pink);
      border-radius: 20px; padding: 16px;
      margin-bottom: 16px;
    }
    .stories-preview-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-top: 10px; margin-bottom: 10px;
    }
    .story-slot {
      position: relative; aspect-ratio: 1;
      border-radius: 12px; border: 1px solid var(--border-pink);
      overflow: hidden; background: #fffafa;
    }
    .story-slot img { width: 100%; height: 100%; object-fit: cover; }
    .field-hint {
      font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; display: block;
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="loginView">
      <div class="login-card">
        <h2 style="color:var(--deep-pink); margin-bottom:20px;">Admin Login ♡</h2>
        <form onsubmit="handleLogin(event)">
          <input type="text" id="userInput" class="input-field" placeholder="kqth1da" required>
          <input type="password" id="passInput" class="input-field" placeholder="••••••" required>
          <button type="submit" class="btn-pink">เข้าสู่ระบบ ✨</button>
          <p id="loginError" style="color:#ff4d6d; font-size:12px; margin-top:10px; display:none;">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <div id="dashboardView">
      <div class="top-bar">
        <div style="font-weight:700; color:var(--deep-pink); font-size:18px;">Dashboard ♡ Jiāníng</div>
        <button onclick="handleLogout()" style="background:#fff; border:1.5px solid var(--border-pink); padding:6px 16px; border-radius:18px; color:var(--deep-pink); font-size:12px; cursor:pointer;">ออกระบบ</button>
      </div>

      <div class="panel-card">
        <div class="panel-title"><span>🎀 ข้อมูลร้านและรูปภาพ</span></div>
        <span class="field-hint">ลิงก์รูปแบนเนอร์:</span>
        <input type="url" id="bannerInput" class="input-field" placeholder="https://files.catbox.moe/...">
        <span class="field-hint">ลิงก์รูปโปรไฟล์:</span>
        <input type="url" id="profileInput" class="input-field" placeholder="https://files.catbox.moe/...">
        <span class="field-hint">ชื่อร้าน:</span>
        <input type="text" id="storeNameInput" class="input-field" placeholder="Yuè Jiāníng ♡">
        <span class="field-hint">คำแนะนำร้าน:</span>
        <textarea id="storeBioInput" class="textarea-field" rows="3"></textarea>
        <span class="field-hint">ลิงก์เพลง (.mp3):</span>
        <input type="url" id="musicUrlInput" class="input-field" placeholder="https://file.garden/...">
      </div>

      <div class="panel-card">
        <div class="panel-title">
          <span>✨ ไฮไลท์ (ภาพชัด 100% ไม่จำกัดจำนวน)</span>
          <button type="button" style="background:#fff; border:1px solid var(--border-pink); color:var(--deep-pink); padding:5px 12px; border-radius:14px; font-size:12px; cursor:pointer;" onclick="addNewHighlight()">+ เพิ่มไฮไลท์</button>
        </div>
        <div id="highlightsAdminBox"></div>
      </div>

      <button type="button" class="btn-pink" id="saveAllBtn" style="font-size:15px; padding:15px; margin-bottom:20px;" onclick="saveAllToCloud()">
        ☁️ บันทึกขึ้นระบบทันที (ภาพชัด 100%) ♡
      </button>

      <div class="panel-card">
        <div class="panel-title"><span>🗑️ รีวิวจากลูกค้า</span></div>
        <div id="reviewsAdminContainer"></div>
      </div>
    </div>

  </div>

  <script>
    const AUTH_USER = "kqth1da";
    const AUTH_PASS = "541113";

    const DB_SITE = "jianing_site_data";
    const DB_HL = "jianing_site_highlights";
    const DB_REVIEWS = "jianing_site_reviews";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let siteData = { banner: "", profile: "", storeName: "Yuè Jiāníng ♡", storeBio: "", musicUrl: "" };
    let highlightsList = [];

    window.onload = function() {
      if (sessionStorage.getItem('jianing_admin_auth') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('userInput').value.trim();
      const p = document.getElementById('passInput').value.trim();
      if (u === AUTH_USER && p === AUTH_PASS) {
        sessionStorage.setItem('jianing_admin_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('jianing_admin_auth');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection(DB_SITE).doc("content").get();
        if (doc.exists) siteData = { ...siteData, ...doc.data() };

        const snap = await db.collection(DB_HL).orderBy("order", "asc").get();
        highlightsList = [];
        snap.forEach(d => {
          highlightsList.push({ id: d.id, ...d.data() });
        });
      } catch (err) {
        console.error(err);
      }

      renderAdminPanels();
      listenReviewsAdmin();
    }

    function renderAdminPanels() {
      document.getElementById('bannerInput').value = siteData.banner || '';
      document.getElementById('profileInput').value = siteData.profile || '';
      document.getElementById('storeNameInput').value = siteData.storeName || '';
      document.getElementById('storeBioInput').value = siteData.storeBio || '';
      document.getElementById('musicUrlInput').value = siteData.musicUrl || '';

      const hlBox = document.getElementById('highlightsAdminBox');
      hlBox.innerHTML = '';

      if (highlightsList.length === 0) {
        hlBox.innerHTML = '<p style="font-size:12px; color:var(--text-muted); padding:10px 0;">ยังไม่มีไฮไลท์ กดปุ่ม "+ เพิ่มไฮไลท์" ด้านบนได้เลยค่ะ</p>';
        return;
      }

      highlightsList.forEach((hl, hIdx) => {
        const card = document.createElement('div');
        card.className = 'hl-admin-card';

        const imgsList = hl.images || [];
        let previewHTML = '';
        imgsList.forEach((url) => {
          if (url.trim()) {
            previewHTML += `<div class="story-slot"><img src="${url.trim()}" onerror="this.src='https://placehold.co/100?text=Error'"></div>`;
          }
        });

        const urlsJoined = imgsList.join('\n');

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div style="font-weight:700; color:var(--deep-pink); font-size:14px;">ไฮไลท์ที่ ${hIdx + 1}</div>
            <button onclick="removeHighlight(${hIdx})" style="background:none; border:none; color:#ff4d6d; font-size:12px; cursor:pointer;">ลบไฮไลท์นี้ 🗑️</button>
          </div>
          <span class="field-hint">ชื่อไฮไลท์:</span>
          <input type="text" class="input-field" value="${hl.title || ''}" placeholder="ชื่อไฮไลท์" onchange="highlightsList[${hIdx}].title = this.value">
          
          <span class="field-hint">ลิงก์รูปปก (URL):</span>
          <input type="url" class="input-field" value="${hl.cover || ''}" placeholder="https://files.catbox.moe/..." onchange="highlightsList[${hIdx}].cover = this.value; renderAdminPanels();">
          
          <span class="field-hint">ลิงก์รูปภาพในสตอรี่ (วาง 1 ลิงก์ ต่อ 1 บรรทัด - ใส่ได้ไม่จำกัด ชัด 100%):</span>
          <textarea class="textarea-field" rows="4" placeholder="https://files.catbox.moe/image1.jpg&#10;https://files.catbox.moe/image2.jpg" onchange="updateHlImages(${hIdx}, this.value)">${urlsJoined}</textarea>
          
          ${previewHTML ? `<span class="field-hint">ตัวอย่างรูป (${imgsList.length} รูป):</span><div class="stories-preview-grid">${previewHTML}</div>` : ''}
        `;
        hlBox.appendChild(card);
      });
    }

    function updateHlImages(idx, textVal) {
      const arr = textVal.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      highlightsList[idx].images = arr;
      renderAdminPanels();
    }

    function addNewHighlight() {
      highlightsList.push({
        title: `Credit Highlights`,
        cover: "",
        images: [],
        order: highlightsList.length
      });
      renderAdminPanels();
    }

    async function removeHighlight(idx) {
      if (confirm(`ต้องการลบไฮไลท์ที่ ${idx + 1} ใช่หรือไม่?`)) {
        const item = highlightsList[idx];
        if (item.id) {
          await db.collection(DB_HL).doc(item.id).delete();
        }
        highlightsList.splice(idx, 1);
        renderAdminPanels();
      }
    }

    async function saveAllToCloud() {
      const btn = document.getElementById('saveAllBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล... ⏳';

      siteData.banner = document.getElementById('bannerInput').value.trim();
      siteData.profile = document.getElementById('profileInput').value.trim();
      siteData.storeName = document.getElementById('storeNameInput').value.trim();
      siteData.storeBio = document.getElementById('storeBioInput').value;
      siteData.musicUrl = document.getElementById('musicUrlInput').value.trim();

      try {
        await db.collection(DB_SITE).doc("content").set(siteData);

        for (let i = 0; i < highlightsList.length; i++) {
          const hl = highlightsList[i];
          const hlDoc = {
            title: hl.title || `Credit Highlights`,
            cover: hl.cover || (hl.images && hl.images[0]) || "",
            images: hl.images || [],
            order: i
          };
          if (hl.id) {
            await db.collection(DB_HL).doc(hl.id).set(hlDoc);
          } else {
            const docRef = await db.collection(DB_HL).add(hlDoc);
            hl.id = docRef.id;
          }
        }

        alert('✨ บันทึกสำเร็จแล้วค่ะ! ภาพชัด 100% แน่นอน');
      } catch (err) {
        console.error(err);
        alert('เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️ บันทึกขึ้นระบบทันที (ภาพชัด 100%) ♡';
      }
    }

    function listenReviewsAdmin() {
      db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snapshot => {
        const container = document.getElementById('reviewsAdminContainer');
        if (snapshot.empty) {
          container.innerHTML = '<p style="text-align:center; font-size:13px; color:var(--text-muted);">ไม่มีรีวิวในระบบ</p>';
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const r = doc.data();
          html += `
            <div style="background:#fff; border:1px solid var(--border-pink); border-radius:16px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700; font-size:13.5px;">${r.name} (${'⭐️'.repeat(r.stars || 5)})</div>
                <div style="font-size:12.5px; color:#635355;">${r.feedback}</div>
              </div>
              <button onclick="deleteReview('${doc.id}')" style="background:#fff0f3; border:1px solid var(--border-pink); color:var(--deep-pink); padding:4px 10px; border-radius:12px; font-size:11px; cursor:pointer;">ลบ 🗑️</button>
            </div>
          `;
        });
        container.innerHTML = html;
      });
    }

    async function deleteReview(docId) {
      if (confirm('ต้องการลบรีวิวนี้ใช่หรือไม่คะ? 🗑️')) {
        await db.collection(DB_REVIEWS).doc(docId).delete();
      }
    }
  </script>
</body>
</html>
